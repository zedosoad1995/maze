<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maze</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div>
      <label for="num-floors">Floors</label>
      <input
        id="num-floors"
        name="numFloors"
        type="number"
        min="1"
        max="20"
        step="1"
        value="3"
      />

      <label for="height">Height</label>
      <input
        id="height"
        name="height"
        type="number"
        min="2"
        max="50"
        step="1"
        value="15"
      />

      <label for="width">Width</label>
      <input
        id="width"
        name="width"
        type="number"
        min="2"
        max="50"
        step="1"
        value="15"
      />
    </div>

    <p id="current-floor" hidden></p>

    <canvas id="maze"></canvas>

    <script type="module" src="index.js"></script>
  </body>
</html>
