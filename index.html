<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maze</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <p id="current-floor" hidden></p>

    <canvas id="maze"></canvas>

    <div class="keyboard-instructions">
      <span>Move: ←↑↓→</span><span class="tutorial-separator">|</span
      ><span>Stairs: Z↑, X↓</span>
    </div>

    <div class="maze-config-panel">
      <label for="num-floors">Floors</label>
      <input
        id="num-floors"
        name="numFloors"
        type="number"
        min="1"
        max="20"
        step="1"
        value="3"
      />

      <label for="height">Height</label>
      <input
        id="height"
        name="height"
        type="number"
        min="2"
        max="50"
        step="1"
        value="15"
      />

      <label for="width">Width</label>
      <input
        id="width"
        name="width"
        type="number"
        min="2"
        max="50"
        step="1"
        value="12"
      />
    </div>

    <div class="touch-controls" aria-label="Maze controls">
      <div class="touch-controls__row">
        <button type="button" data-direction="north" aria-label="Move up">
          ↑
        </button>
      </div>
      <div class="touch-controls__row">
        <button type="button" data-direction="left" aria-label="Move left">
          ←
        </button>
        <button type="button" data-direction="south" aria-label="Move down">
          ↓
        </button>
        <button type="button" data-direction="right" aria-label="Move right">
          →
        </button>
      </div>
      <div class="touch-controls__row touch-controls__stairs">
        <button type="button" data-direction="down">⇩ Stairs down</button>
        <button type="button" data-direction="up">⇧ Stairs up</button>
      </div>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
